<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E8F0F8"/><stop offset="1" stop-color="#C8D8E8"/></linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0B1D33"/><stop offset="1" stop-color="#061018"/></linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <rect x="0" y="300" width="800" height="100" fill="#8A9A8A"/>
  <rect x="0" y="300" width="800" height="8" fill="#6A7A6A"/>
  <!-- house -->
  <rect x="30" y="140" width="150" height="160" fill="#F5F0E8" stroke="#2A2A2A" stroke-width="2"/>
  <polygon points="30,140 105,70 180,140" fill="#C45C26" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="55" y="200" width="40" height="100" fill="#0B1D33"/>
  <rect x="115" y="175" width="45" height="40" fill="#A8D4E8" stroke="#2A2A2A"/>
  <!-- VERIFIED truck -->
  <rect x="250" y="155" width="380" height="130" rx="6" fill="url(#truck)"/>
  <rect x="250" y="155" width="100" height="55" rx="4" fill="#E63946"/>
  <text x="268" y="190" fill="#fff" font-family="Arial Black,sans-serif" font-size="16" font-weight="900">VERIFIED</text>
  <text x="370" y="220" fill="#E8B84A" font-family="Arial,sans-serif" font-size="18" font-weight="800">MOVERS &amp; PACKERS</text>
  <text x="370" y="245" fill="#fff" font-family="Arial,sans-serif" font-size="12" opacity=".8">ZIRAKPUR · GST VERIFIED</text>
  <!-- cabin -->
  <rect x="620" y="180" width="100" height="105" rx="6" fill="#0B1D33"/>
  <rect x="640" y="195" width="55" height="42" rx="3" fill="#A8D4E8"/>
  <!-- wheels -->
  <circle cx="320" cy="300" r="28" fill="#1A1A1A"/><circle cx="320" cy="300" r="14" fill="#666"/>
  <circle cx="480" cy="300" r="28" fill="#1A1A1A"/><circle cx="480" cy="300" r="14" fill="#666"/>
  <circle cx="680" cy="300" r="28" fill="#1A1A1A"/><circle cx="680" cy="300" r="14" fill="#666"/>
  <!-- mover 1 with VERIFIED shirt -->
  <circle cx="200" cy="200" r="18" fill="#E8C4A0"/>
  <rect x="182" y="218" width="36" height="50" rx="4" fill="#0B1D33"/>
  <text x="186" y="245" fill="#E63946" font-family="Arial,sans-serif" font-size="7" font-weight="800">VERIFIED</text>
  <rect x="182" y="268" width="14" height="32" fill="#2A2A2A"/>
  <rect x="204" y="268" width="14" height="32" fill="#2A2A2A"/>
  <!-- boxes -->
  <rect x="210" y="240" width="45" height="35" fill="#D4A85A" stroke="#2A2A2A"/>
  <rect x="225" y="210" width="40" height="30" fill="#C9923A" stroke="#2A2A2A"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t3 d3">
<title id="t3">Office relocation</title>
<desc id="d3">Office desks and equipment being moved by professional crew</desc>
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f4f8"/><stop offset="1" stop-color="#dce4ec"/></linearGradient>
</defs>
<rect width="640" height="360" fill="url(#bg3)"/>
<!-- floor -->
<rect x="0" y="260" width="640" height="100" fill="#b8c4d0"/>
<!-- desk -->
<rect x="80" y="180" width="200" height="12" fill="#8b6914" stroke="#2c2416" stroke-width="1"/>
<rect x="90" y="192" width="12" height="70" fill="#6b5010"/>
<rect x="258" y="192" width="12" height="70" fill="#6b5010"/>
<!-- monitor -->
<rect x="140" y="120" width="80" height="55" rx="3" fill="#1e3a5f"/>
<rect x="148" y="128" width="64" height="40" fill="#4a9ecf"/>
<rect x="170" y="175" width="20" height="8" fill="#2c2416"/>
<!-- chair -->
<rect x="320" y="200" width="70" height="10" fill="#1e3a5f"/>
<rect x="340" y="210" width="30" height="50" fill="#1e3a5f"/>
<ellipse cx="355" cy="200" rx="28" ry="12" fill="#2a4a6f"/>
<!-- boxes labeled office -->
<rect x="420" y="180" width="100" height="80" fill="#c9a66b" stroke="#2c2416" stroke-width="1.5"/>
<rect x="440" y="130" width="90" height="55" fill="#d4b483" stroke="#2c2416" stroke-width="1.5"/>
<text x="448" y="162" fill="#1e3a5f" font-family="sans-serif" font-size="12" font-weight="700">IT GEAR</text>
<!-- server rack hint -->
<rect x="540" y="150" width="60" height="110" fill="#2c3440" stroke="#1a2028" stroke-width="2"/>
<rect x="548" y="160" width="44" height="8" fill="#3d8b5f"/>
<rect x="548" y="175" width="44" height="8" fill="#3d8b5f"/>
<rect x="548" y="190" width="44" height="8" fill="#c45c26"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t4 d4">
<title id="t4">Vehicle transport</title>
<desc id="d4">Car being transported on a professional carrier truck</desc>
<defs>
  <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8f0e8"/><stop offset="1" stop-color="#d0dcc8"/></linearGradient>
  <linearGradient id="car4" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c45c26"/><stop offset="1" stop-color="#8a3a12"/></linearGradient>
</defs>
<rect width="640" height="360" fill="url(#bg4)"/>
<!-- road -->
<rect x="0" y="280" width="640" height="80" fill="#5a5a5a"/>
<rect x="0" y="312" width="640" height="8" fill="#e8d44a"/>
<!-- carrier bed -->
<rect x="40" y="200" width="520" height="30" fill="#3a3a3a"/>
<rect x="40" y="180" width="20" height="100" fill="#2a2a2a"/>
<!-- car on carrier -->
<ellipse cx="280" cy="195" rx="110" ry="35" fill="url(#car4)"/>
<rect x="200" y="155" width="160" height="45" rx="12" fill="url(#car4)"/>
<rect x="220" y="160" width="50" height="28" rx="4" fill="#a8d4e8"/>
<rect x="290" y="160" width="50" height="28" rx="4" fill="#a8d4e8"/>
<!-- car wheels -->
<circle cx="230" cy="205" r="16" fill="#1a1a1a"/><circle cx="230" cy="205" r="8" fill="#666"/>
<circle cx="330" cy="205" r="16" fill="#1a1a1a"/><circle cx="330" cy="205" r="8" fill="#666"/>
<!-- truck cab -->
<rect x="520" y="160" width="100" height="90" rx="6" fill="#1e3a5f"/>
<rect x="540" y="170" width="55" height="40" rx="3" fill="#a8d4e8"/>
<circle cx="560" cy="260" r="24" fill="#1a1a1a"/><circle cx="560" cy="260" r="12" fill="#666"/>
<circle cx="100" cy="240" r="18" fill="#1a1a1a"/><circle cx="100" cy="240" r="9" fill="#666"/>
<circle cx="450" cy="240" r="18" fill="#1a1a1a"/><circle cx="450" cy="240" r="9" fill="#666"/>
</svg>

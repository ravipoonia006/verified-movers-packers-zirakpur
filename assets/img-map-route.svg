<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><title>Moving route map</title>
<defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4fa"/><stop offset="1" stop-color="#d4e0ec"/></linearGradient></defs>
<rect width="640" height="360" fill="url(#m)"/>
<!-- route line -->
<path d="M80 280 Q200 80 320 180 T560 100" fill="none" stroke="#c45c26" stroke-width="6" stroke-dasharray="12 8" stroke-linecap="round"/>
<!-- start pin -->
<circle cx="80" cy="280" r="18" fill="#1e3a5f"/><circle cx="80" cy="280" r="8" fill="#fff"/>
<text x="55" y="320" fill="#1e3a5f" font-family="sans-serif" font-size="13" font-weight="700">Pickup</text>
<!-- mid -->
<circle cx="320" cy="180" r="14" fill="#c45c26"/><circle cx="320" cy="180" r="6" fill="#fff"/>
<!-- end pin -->
<circle cx="560" cy="100" r="18" fill="#3d8b5f"/><circle cx="560" cy="100" r="8" fill="#fff"/>
<text x="520" y="140" fill="#1e3a5f" font-family="sans-serif" font-size="13" font-weight="700">Drop</text>
<!-- truck icon simplified -->
<rect x="280" y="220" width="90" height="40" rx="4" fill="#1e3a5f"/>
<rect x="360" y="230" width="30" height="30" rx="3" fill="#1e3a5f"/>
<circle cx="300" cy="265" r="10" fill="#2c2416"/><circle cx="355" cy="265" r="10" fill="#2c2416"/>
</svg>
